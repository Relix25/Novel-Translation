name: Report a bug
description: Describe a reproducible issue using synthetic data.
body:
  - type: markdown
    attributes:
      value: Never attach manuscripts, SQLite databases, personal paths, account readings or Codex credentials. Use the synthetic demo.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Novel version, operating system and launch mode
