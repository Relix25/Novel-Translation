[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["local-*", "appdata", "docker-data", "frontend"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "batches", "benchmark", "bulk_jobs", "codex_bridge", "consumption", "demo_fixture", "docker_bootstrap", "epubs", "folders", "instance_lock", "job_tracking", "library", "novel_v1", "quality_review", "quota", "source_images", "story_memory", "tools", "translation_prompt"]
